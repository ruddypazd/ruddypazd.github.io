<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mundo 3D de Roy Ruddy Paz: explora a Ruddy en 3D.">
    <title>Mundo 3D · Roy Ruddy Paz</title>
    <link rel="icon" type="image/jpeg" href="../images/perfil.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <canvas id="world" aria-label="Escena 3D con Ruddy"></canvas>

    <header class="hud hud--top">
        <a href="../" class="hud__back">← Portafolio</a>
        <span class="hud__title">Mundo&nbsp;<span class="grad">3D</span></span>
        <span class="hud__actions">
            <button class="hud__icon" type="button" data-talk data-agent-id="agent_7001kxsnr66mej8tctnrrcrwtd6c" aria-label="Hablar con Ruddy por voz" aria-pressed="false">📞</button>
            <button class="hud__icon" type="button" data-chat-open aria-label="Escribir un mensaje sobre Ruddy" aria-expanded="false">💬</button>
            <button class="hud__icon" type="button" data-music aria-label="Silenciar música">🔊</button>
        </span>
    </header>

    <form class="chat" data-chat hidden autocomplete="off">
        <input class="chat__input" type="text" name="msg" maxlength="120" placeholder="Escribe algo para que Ruddy lo diga…" aria-label="Mensaje" enterkeyhint="send">
        <button class="chat__send" type="submit">Enviar</button>
    </form>

    <div class="bubble" data-bubble hidden aria-live="polite"></div>

    <p class="talk" data-talk-status hidden aria-live="polite"></p>

    <div class="hud hud--loader" data-loader>
        <span class="hud__spinner" aria-hidden="true"></span>
        <span data-loader-text>Cargando a Ruddy…</span>
    </div>

    <div class="joystick" data-joystick aria-label="Joystick para mover a Ruddy" role="application">
        <span class="joystick__knob" data-joystick-knob></span>
    </div>

    <button class="jump-btn" type="button" data-jump aria-label="Saltar" hidden>Saltar</button>
    <button class="run-btn" type="button" data-run aria-pressed="false">Correr</button>

    <footer class="hud hud--bottom">
        <p data-model-note hidden>Modelo provisional: el avatar real de Ruddy llegará pronto.</p>
        <p class="hud__link" data-link-hint hidden></p>
        <p class="hud__hint">Joystick o WASD para moverte · R, Shift o «Correr» para correr · Espacio salta · Enter escribe un mensaje · 📞 habla con Ruddy · Toca un cartel para abrir la cotización</p>
    </footer>

    <script type="module" src="world.js"></script>
</body>
</html>
